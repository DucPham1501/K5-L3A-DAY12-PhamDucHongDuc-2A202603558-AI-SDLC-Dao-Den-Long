<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0E1430"><title>Đảo Đèn Lồng · v1.0.0</title><meta name="description" content="Cùng Mây mang ánh sáng trở về qua ba hòn đảo giữa biển mây."><link rel="stylesheet" href="/web/style.css"><script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script></head><body>
<main id="game" aria-label="Game 3D Đảo Đèn Lồng"></main>
<div id="flash" aria-hidden="true"></div>
<div id="hud" hidden>
<div id="indicators" aria-hidden="true"></div>
<header class="topbar"><div class="health-panel glass"><span class="eyebrow">NGỌN LỬA</span><strong id="health">✦ ✦ ✦</strong><span id="charm-status"></span></div><div class="clock-panel"><span id="chapter" class="eyebrow">ĐÊM 1 · ĐẢO BẾN</span><strong id="clock">04:00</strong><span id="wind-status"></span></div><div class="score-panel glass"><strong id="lit-count">0 / 5 đèn</strong><span>Điểm <b id="score">0</b></span><span id="low-fuel"></span></div></header>
<aside class="map-panel glass"><canvas id="minimap" width="200" height="160" aria-label="Bản đồ đảo"></canvas></aside>
<div id="toast" role="status" aria-live="polite"></div>
<div id="captions" role="log" aria-live="polite" aria-label="Phụ đề sự kiện"></div>
<div id="interaction" class="interaction" hidden></div><div id="direction" hidden><span id="direction-arrow">▲</span><span id="direction-text"></span></div>
<footer class="bottom-ui"><div class="inventory glass"><span class="eyebrow">ĐOM ĐÓM <b id="carried">0 / 10</b></span><div id="mote-slots"></div></div><div class="abilities"><button id="dash-button" class="ability"><span>〰</span><div>Lướt <kbd id="dash-key">Shift</kbd><small id="dash-status">Sẵn sàng</small></div></button><button id="pulse-button" class="ability"><span>☼</span><div>Tỏa sáng <kbd id="pulse-key">Q</kbd><small id="pulse-status">3 đom đóm</small></div></button></div></footer>
<nav class="controls"><span><kbd id="move-keys">W A S D</kbd> Đi</span><span><kbd id="jump-key">Space</kbd> Nhảy</span><span><kbd id="interact-key">E</kbd> Đèn</span><span><kbd>← →</kbd> Camera</span><button id="help-button">Hướng dẫn</button><button id="pause-button">Tạm dừng <kbd id="pause-key">Esc</kbd></button></nav>
</div>
<div id="overlay" class="overlay"><section class="modal" role="dialog" aria-labelledby="modal-title"><div class="emblem">☾</div><span id="modal-kicker" class="eyebrow">CHUYỆN KỂ TỪ BIỂN MÂY</span><h1 id="modal-title">Đảo Đèn Lồng</h1><p id="modal-copy">Ba hòn đảo. Một người giữ đèn nhỏ. Một hành trình mang ánh sáng trở về.</p><div id="modal-detail"></div><div id="modal-actions"></div><p id="footnote" class="footnote">WASD · Space nhảy · Shift lướt · E nạp đèn · Q tỏa sáng</p></section></div>
<script type="module" src="/web/main.mjs"></script></body></html>
